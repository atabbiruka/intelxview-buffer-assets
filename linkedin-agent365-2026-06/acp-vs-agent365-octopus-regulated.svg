<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#15251d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.48" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#c27803"/>
    </linearGradient>
    <linearGradient id="acpPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5132"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="msPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: "Inter", "Segoe UI", "Liberation Sans", Arial, sans-serif; }
      .eyebrow { font-size: 24px; font-weight: 800; fill: #fbbf24; }
      .title { font-size: 66px; font-weight: 850; fill: #f8fafc; }
      .subtitle { font-size: 32px; font-weight: 650; fill: #cbd5e1; }
      .sideTitle { font-size: 29px; font-weight: 850; fill: #ffffff; }
      .sideSub { font-size: 22px; font-weight: 700; fill: #dbeafe; }
      .legText { font-size: 24px; font-weight: 780; fill: #f8fafc; }
      .legSmall { font-size: 19px; font-weight: 650; fill: #dbe4ee; }
      .center { font-size: 28px; font-weight: 850; fill: #ffffff; }
      .verdict { font-size: 34px; font-weight: 850; fill: #111827; }
      .verdictSmall { font-size: 24px; font-weight: 750; fill: #1f2937; }
      .brand { font-size: 30px; font-weight: 850; fill: #ffffff; }
      .muted { font-size: 23px; font-weight: 650; fill: #a7b4c5; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="1020" cy="180" r="210" fill="#38bdf8" opacity="0.08"/>
  <circle cx="120" cy="1260" r="240" fill="#f59e0b" opacity="0.08"/>

  <text x="76" y="82" class="sans eyebrow">AGENT SPRAWL HAS TENTACLES</text>
  <text x="76" y="168" class="sans title">ACP vs Microsoft Agent 365</text>
  <text x="78" y="228" class="sans subtitle">For regulated environments, the winner is the evidence layer.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="290" width="446" height="118" rx="28" fill="url(#msPanel)"/>
    <text x="106" y="340" class="sans sideTitle">Microsoft Agent 365 / SDK</text>
    <text x="106" y="378" class="sans sideSub">Controls the agent estate</text>

    <rect x="680" y="290" width="446" height="118" rx="28" fill="url(#acpPanel)"/>
    <text x="712" y="340" class="sans sideTitle">AI Control Plane (ACP)</text>
    <text x="712" y="378" class="sans sideSub">Proves regulated decisions</text>
  </g>

  <g opacity="0.96">
    <path d="M548 608 C414 548, 292 536, 116 474" fill="none" stroke="#2f81f7" stroke-width="30" stroke-linecap="round"/>
    <path d="M548 664 C398 650, 286 676, 106 650" fill="none" stroke="#2f81f7" stroke-width="30" stroke-linecap="round"/>
    <path d="M560 720 C414 764, 282 816, 126 842" fill="none" stroke="#2f81f7" stroke-width="30" stroke-linecap="round"/>
    <path d="M578 772 C446 862, 340 960, 160 1022" fill="none" stroke="#2f81f7" stroke-width="30" stroke-linecap="round"/>
    <path d="M596 810 C520 942, 424 1052, 306 1168" fill="none" stroke="#2f81f7" stroke-width="30" stroke-linecap="round"/>

    <path d="M652 608 C786 548, 908 536, 1084 474" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
    <path d="M652 664 C802 650, 914 676, 1094 650" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
    <path d="M640 720 C786 764, 918 816, 1074 842" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
    <path d="M622 772 C754 862, 860 960, 1040 1022" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
    <path d="M604 810 C680 942, 776 1052, 894 1168" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="600" cy="590" rx="142" ry="164" fill="url(#head)" stroke="#e5e7eb" stroke-opacity="0.42" stroke-width="3"/>
    <circle cx="552" cy="560" r="16" fill="#f8fafc"/>
    <circle cx="648" cy="560" r="16" fill="#f8fafc"/>
    <circle cx="556" cy="562" r="7" fill="#111827"/>
    <circle cx="644" cy="562" r="7" fill="#111827"/>
    <path d="M552 642 C580 666, 622 666, 650 642" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <text x="518" y="715" class="sans center">AGENT</text>
    <text x="486" y="753" class="sans center">SPRAWL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="438" width="370" height="82" rx="20" fill="#12305a" stroke="#60a5fa" stroke-width="2"/>
    <text x="88" y="476" class="sans legText">Agent inventory</text>
    <text x="88" y="505" class="sans legSmall">What agents exist?</text>

    <rect x="56" y="612" width="370" height="82" rx="20" fill="#12305a" stroke="#60a5fa" stroke-width="2"/>
    <text x="88" y="650" class="sans legText">Identity and access</text>
    <text x="88" y="679" class="sans legSmall">Who can use which tool?</text>

    <rect x="56" y="806" width="370" height="82" rx="20" fill="#12305a" stroke="#60a5fa" stroke-width="2"/>
    <text x="88" y="844" class="sans legText">M365 integration</text>
    <text x="88" y="873" class="sans legSmall">Where agents connect</text>

    <rect x="96" y="988" width="370" height="82" rx="20" fill="#12305a" stroke="#60a5fa" stroke-width="2"/>
    <text x="128" y="1026" class="sans legText">Telemetry</text>
    <text x="128" y="1055" class="sans legSmall">What activity is visible?</text>

    <rect x="240" y="1144" width="350" height="82" rx="20" fill="#12305a" stroke="#60a5fa" stroke-width="2"/>
    <text x="272" y="1182" class="sans legText">Security controls</text>
    <text x="272" y="1211" class="sans legSmall">How the estate is governed</text>

    <rect x="774" y="438" width="370" height="82" rx="20" fill="#553516" stroke="#fbbf24" stroke-width="2"/>
    <text x="806" y="476" class="sans legText">Decision evidence</text>
    <text x="806" y="505" class="sans legSmall">What happened, step by step?</text>

    <rect x="774" y="612" width="370" height="82" rx="20" fill="#553516" stroke="#fbbf24" stroke-width="2"/>
    <text x="806" y="650" class="sans legText">Named owner</text>
    <text x="806" y="679" class="sans legSmall">Who stands behind it?</text>

    <rect x="774" y="806" width="370" height="82" rx="20" fill="#553516" stroke="#fbbf24" stroke-width="2"/>
    <text x="806" y="844" class="sans legText">Data-boundary proof</text>
    <text x="806" y="873" class="sans legSmall">What data was touched?</text>

    <rect x="734" y="988" width="410" height="82" rx="20" fill="#553516" stroke="#fbbf24" stroke-width="2"/>
    <text x="766" y="1026" class="sans legText">Exception and approval trail</text>
    <text x="766" y="1055" class="sans legSmall">Who allowed the outcome?</text>

    <rect x="610" y="1144" width="534" height="82" rx="20" fill="#553516" stroke="#fbbf24" stroke-width="2"/>
    <text x="642" y="1182" class="sans legText">Regulator-ready reconstruction</text>
    <text x="642" y="1211" class="sans legSmall">Can the firm prove the decision on demand?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="104" y="1280" width="992" height="112" rx="28" fill="#f8fafc"/>
    <text x="152" y="1326" class="sans verdict">Regulated AI needs more than agent management.</text>
    <text x="152" y="1365" class="sans verdictSmall">Agent 365 manages the estate. ACP proves the decision.</text>
  </g>

  <text x="76" y="1462" class="sans brand">IntelXview</text>
  <text x="268" y="1462" class="sans muted">AI evidence for regulated firms</text>
</svg>
