<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.45" stop-color="#111827"/>
      <stop offset="1" stop-color="#16251f"/>
    </linearGradient>
    <linearGradient id="ms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="acp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .sans { font-family: "Inter", "Segoe UI", "Liberation Sans", Arial, sans-serif; }
      .title { font-size: 70px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 34px; font-weight: 600; fill: #cbd5e1; }
      .eyebrow { font-size: 23px; font-weight: 800; letter-spacing: 3px; fill: #fbbf24; }
      .panel-title { font-size: 34px; font-weight: 800; fill: #ffffff; }
      .panel-sub { font-size: 24px; font-weight: 700; fill: #dbeafe; }
      .body { font-size: 28px; font-weight: 500; fill: #e5e7eb; }
      .small { font-size: 22px; font-weight: 600; fill: #cbd5e1; }
      .label { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .brand { font-size: 30px; font-weight: 800; fill: #ffffff; }
      .muted { font-size: 24px; font-weight: 600; fill: #a7b4c5; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <path d="M84 248 C256 120, 418 210, 536 112 C690 -16, 928 52, 1112 184" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="42"/>
  <path d="M80 1280 C298 1172, 422 1382, 654 1258 C824 1168, 962 1202, 1126 1296" fill="none" stroke="#f59e0b" stroke-opacity="0.20" stroke-width="48"/>

  <text x="78" y="86" class="sans eyebrow">INTELXVIEW FIELD NOTE</text>
  <text x="78" y="176" class="sans title">AI Control Plane</text>
  <text x="78" y="252" class="sans title">vs Agent 365</text>
  <text x="80" y="314" class="sans subtitle">Different layers. Different board question.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="402" width="498" height="654" rx="24" fill="#0f2238" stroke="#2f81f7" stroke-width="3"/>
    <rect x="72" y="402" width="498" height="96" rx="24" fill="url(#ms)"/>
    <rect x="72" y="474" width="498" height="24" fill="#14b8a6"/>
    <text x="108" y="463" class="sans panel-title">Microsoft Agent 365</text>
    <text x="108" y="540" class="sans panel-sub">Agent estate control</text>

    <circle cx="112" cy="604" r="12" fill="#60a5fa"/>
    <text x="142" y="613" class="sans body">Agent registry</text>

    <circle cx="112" cy="686" r="12" fill="#60a5fa"/>
    <text x="142" y="695" class="sans body">Identity and access</text>

    <circle cx="112" cy="768" r="12" fill="#60a5fa"/>
    <text x="142" y="777" class="sans body">OpenTelemetry observability</text>

    <circle cx="112" cy="850" r="12" fill="#60a5fa"/>
    <text x="142" y="859" class="sans body">M365 tool and data access</text>

    <circle cx="112" cy="932" r="12" fill="#60a5fa"/>
    <text x="142" y="941" class="sans body">Defender, Entra, Purview</text>

    <rect x="108" y="984" width="222" height="42" rx="21" fill="#bfdbfe"/>
    <text x="132" y="1013" class="sans label">Question answered</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="402" width="498" height="654" rx="24" fill="#2a1b13" stroke="#f59e0b" stroke-width="3"/>
    <rect x="630" y="402" width="498" height="96" rx="24" fill="url(#acp)"/>
    <rect x="630" y="474" width="498" height="24" fill="#ef4444"/>
    <text x="666" y="463" class="sans panel-title">ACP</text>
    <text x="666" y="540" class="sans panel-sub">Decision evidence control</text>

    <circle cx="670" cy="604" r="12" fill="#fbbf24"/>
    <text x="700" y="613" class="sans body">Use case and owner</text>

    <circle cx="670" cy="686" r="12" fill="#fbbf24"/>
    <text x="700" y="695" class="sans body">Data boundary and policy</text>

    <circle cx="670" cy="768" r="12" fill="#fbbf24"/>
    <text x="700" y="777" class="sans body">Control, exception, approval</text>

    <circle cx="670" cy="850" r="12" fill="#fbbf24"/>
    <text x="700" y="859" class="sans body">Evidence chain per decision</text>

    <circle cx="670" cy="932" r="12" fill="#fbbf24"/>
    <text x="700" y="941" class="sans body">Board and regulator proof</text>

    <rect x="666" y="984" width="222" height="42" rx="21" fill="#fde68a"/>
    <text x="690" y="1013" class="sans label">Question answered</text>
  </g>

  <g>
    <rect x="142" y="1096" width="916" height="164" rx="24" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-opacity="0.18"/>
    <text x="188" y="1152" class="sans small">Agent 365 asks:</text>
    <text x="188" y="1198" class="sans body">Can we manage and observe the agents?</text>
    <text x="188" y="1248" class="sans small">ACP asks:</text>
    <text x="188" y="1294" class="sans body">Can we prove the decision when challenged?</text>
  </g>

  <g>
    <rect x="184" y="1332" width="832" height="76" rx="38" fill="#f59e0b"/>
    <text x="238" y="1382" class="sans label" style="font-size: 30px;">Agent sprawl is the first problem. Unprovable decisions are the next.</text>
  </g>

  <text x="78" y="1462" class="sans brand">IntelXview</text>
  <text x="272" y="1462" class="sans muted">AI evidence for regulated firms</text>
</svg>
